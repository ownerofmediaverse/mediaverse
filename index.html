<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
MEDIAVERSE — Login
</title>


<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

/* =====================================================
   GOOGLE FONT
===================================================== */

@import url(
    "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap"
);


/* =====================================================
   ROOT
===================================================== */

:root{

    --bg:#080914;

    --bg-soft:#0e1020;

    --glass:
        rgba(18,20,37,.56);

    --glass-strong:
        rgba(20,23,43,.78);

    --glass-light:
        rgba(255,255,255,.055);

    --border:
        rgba(255,255,255,.10);

    --border-bright:
        rgba(255,255,255,.18);

    --text:#f7f8ff;

    --muted:#9399b2;

    --cyan:#00e5ff;

    --purple:#a855f7;

    --pink:#ff4ecd;

    --blue:#4d7cff;

    --green:#35e69a;

    --orange:#ff9f43;

    --danger:#ff6b81;

    --warning:#ffcc66;

    --shadow:
        0 25px 80px
        rgba(0,0,0,.42);

    --radius:24px;

}


/* =====================================================
   RESET
===================================================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


html{

    min-height:100%;

}


body{

    min-height:100vh;

    font-family:
        "Inter",
        Arial,
        sans-serif;

    color:
        var(--text);

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(168,85,247,.18),
            transparent 25%
        ),

        radial-gradient(
            circle at 95% 15%,
            rgba(0,229,255,.14),
            transparent 26%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(255,78,205,.09),
            transparent 35%
        ),

        var(--bg);

    display:flex;

    align-items:center;

    justify-content:center;

    overflow-x:hidden;

    padding:25px;

    transition:
        background .45s ease,
        color .45s ease;

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{

    width:7px;

}


::-webkit-scrollbar-track{

    background:
        var(--bg);

}


::-webkit-scrollbar-thumb{

    border-radius:20px;

    background:
        linear-gradient(
            var(--purple),
            var(--cyan)
        );

}


/* =====================================================
   AURORA BACKGROUND
===================================================== */

body::before{

    content:"";

    position:fixed;

    inset:0;

    z-index:-5;

    pointer-events:none;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025)
            1px,
            transparent
            1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025)
            1px,
            transparent
            1px
        );

    background-size:
        55px
        55px;

    opacity:.18;

    mask-image:
        radial-gradient(
            ellipse at center,
            black,
            transparent 80%
        );

    -webkit-mask-image:
        radial-gradient(
            ellipse at center,
            black,
            transparent 80%
        );

}


/* =====================================================
   BACKGROUND GLOW
===================================================== */

.glow,

.glow2{

    position:fixed;

    width:550px;

    height:550px;

    border-radius:50%;

    filter:
        blur(120px);

    pointer-events:none;

    z-index:-3;

    opacity:.15;

    animation:
        floatOrb
        16s
        ease-in-out
        infinite;

}


.glow{

    top:-230px;

    left:-180px;

    background:
        var(--purple);

}


.glow2{

    right:-220px;

    bottom:-240px;

    background:
        var(--cyan);

    animation-delay:
        -8s;

}


@keyframes floatOrb{

    0%,
    100%{

        transform:
            translate(0,0)
            scale(1);

    }

    50%{

        transform:
            translate(80px,50px)
            scale(1.18);

    }

}


/* =====================================================
   LIGHT THEME — FULL VISIBILITY FIX
===================================================== */

.light{

    --bg:#eef1f8;

    --bg-soft:#ffffff;

    --glass:
        rgba(255,255,255,.78);

    --glass-strong:
        rgba(255,255,255,.92);

    --glass-light:
        rgba(20,25,45,.04);

    --border:
        rgba(35,45,80,.15);

    --border-bright:
        rgba(35,45,80,.24);

    --text:#171a2b;

    --muted:#5f6780;

    --cyan:#009ec7;

    --purple:#7c3aed;

    --pink:#e82fae;

    --blue:#3867e8;

    --green:#159f64;

    --orange:#d97706;

    --danger:#d93655;

    --warning:#b77900;

    --shadow:
        0 25px 80px
        rgba(35,45,80,.15);

}


/* =====================================================
   LIGHT BODY
===================================================== */

.light{

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(124,58,237,.15),
            transparent 30%
        ),

        radial-gradient(
            circle at 95% 15%,
            rgba(0,158,199,.12),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(232,47,174,.08),
            transparent 38%
        ),

        #eef1f8;

}


/* =====================================================
   LIGHT GRID
===================================================== */

.light body::before{

    opacity:.35;

    background-image:

        linear-gradient(
            rgba(30,40,70,.05)
            1px,
            transparent
            1px
        ),

        linear-gradient(
            90deg,
            rgba(30,40,70,.05)
            1px,
            transparent
            1px
        );

}


/* =====================================================
   LIGHT CARD
===================================================== */

.light .card{

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.88),
            rgba(247,249,255,.72)
        );

    border-color:
        rgba(50,60,100,.14);

    box-shadow:

        0 25px 80px
        rgba(40,50,90,.16),

        inset
        0
        1px
        0
        rgba(255,255,255,.9);

}


/* =====================================================
   LIGHT CARD TOP GLOW
===================================================== */

.light .card::before{

    opacity:.75;

}


/* =====================================================
   LIGHT THEME BUTTON
===================================================== */

.light .theme-btn{

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.88),
            rgba(245,247,255,.75)
        );

    color:
        #20243a;

    border-color:
        rgba(40,50,90,.15);

    box-shadow:

        0 12px 35px
        rgba(40,50,90,.12);

}


.light .theme-btn:hover{

    color:
        #111827;

    border-color:
        rgba(0,158,199,.38);

}


/* =====================================================
   LIGHT LOGO
===================================================== */

.light .logo{

    color:
        #171a2b;

    text-shadow:none;

}


/* =====================================================
   LIGHT SUBTITLE
===================================================== */

.light .subtitle{

    color:
        #5f6780;

}


/* =====================================================
   LIGHT INPUT
===================================================== */

.light input{

    color:
        #171a2b;

    background:
        rgba(255,255,255,.82);

    border-color:
        rgba(45,55,90,.16);

    box-shadow:

        inset
        0
        1px
        0
        rgba(255,255,255,.9);

}


.light input:hover{

    background:
        #ffffff;

    border-color:
        rgba(45,55,90,.23);

}


.light input:focus{

    color:
        #171a2b;

    background:
        #ffffff;

    border-color:
        rgba(0,158,199,.55);

    box-shadow:

        0 0 0 4px
        rgba(0,158,199,.08),

        0 0 25px
        rgba(0,158,199,.10);

}


.light input::placeholder{

    color:
        #788197;

    opacity:1;

}


/* =====================================================
   LIGHT INPUT ICONS
===================================================== */

.light .input-box i{

    color:
        #009ec7;

    filter:

        drop-shadow(
            0 0 8px
            rgba(0,158,199,.22)
        );

}


.light .input-box:focus-within i:not(.eye){

    color:
        #7c3aed;

    filter:

        drop-shadow(
            0 0 10px
            rgba(124,58,237,.28)
        );

}


.light .input-box .eye{

    color:
        #69728a;

    filter:none;

}


.light .input-box .eye:hover{

    color:
        #009ec7;

}


/* =====================================================
   LIGHT EMAIL STATUS
===================================================== */

.light .email-valid{

    color:
        #128554;

}


.light .email-invalid{

    color:
        #c92f49;

}


.light .email-checking{

    color:
        #a66d00;

}


/* =====================================================
   LIGHT OPTIONS
===================================================== */

.light .remember{

    color:
        #5f6780;

}


.light .remember:hover{

    color:
        #171a2b;

}


/* =====================================================
   LIGHT CHECKBOX
===================================================== */

.light .check-design{

    background:
        rgba(255,255,255,.9);

    border-color:
        rgba(40,50,90,.20);

    box-shadow:

        inset
        0
        0
        10px
        rgba(30,40,70,.03);

}


.light .remember input:checked
+
.check-design{

    border-color:
        rgba(0,158,199,.55);

    background:

        linear-gradient(
            135deg,
            #7c3aed,
            #009ec7
        );

}


.light .forgot{

    color:
        #007fa5;

}


.light .forgot:hover{

    color:
        #005e7a;

    text-shadow:

        0 0 10px
        rgba(0,158,199,.20);

}


/* =====================================================
   LIGHT LOGIN MESSAGE
===================================================== */

.light #loginMessage.error{

    color:
        #bd2843;

    background:
        rgba(217,54,85,.08);

    border-color:
        rgba(217,54,85,.18);

}


.light #loginMessage.success{

    color:
        #087346;

    background:
        rgba(21,159,100,.09);

    border-color:
        rgba(21,159,100,.18);

}


.light #loginMessage.warning{

    color:
        #8a5c00;

    background:
        rgba(217,119,6,.09);

    border-color:
        rgba(217,119,6,.18);

}


.light .cooldown-timer{

    color:
        #a56700;

    text-shadow:

        0 0 12px
        rgba(217,119,6,.20);

}


/* =====================================================
   LIGHT LOGIN BUTTON
===================================================== */

.light .login-btn{

    background:

        linear-gradient(
            135deg,
            #7c3aed,
            #009ec7
        );

    color:
        #ffffff;

    box-shadow:

        0 14px 35px
        rgba(124,58,237,.25);

}


.light .login-btn:hover:not(:disabled){

    box-shadow:

        0 18px 42px
        rgba(124,58,237,.28),

        0 0 22px
        rgba(0,158,199,.13);

}


/* =====================================================
   LIGHT SIGNUP TEXT
===================================================== */

.light .signup{

    color:
        #5f6780;

}


.light .signup a{

    color:
        #007fa5;

}


.light .signup a:hover{

    color:
        #005e7a;

    text-shadow:

        0 0 10px
        rgba(0,158,199,.20);

}


/* =====================================================
   LIGHT BACKGROUND GLOW
===================================================== */

.light .glow{

    opacity:.10;

    background:
        #7c3aed;

}


.light .glow2{

    opacity:.09;

    background:
        #009ec7;

}


/* =====================================================
   LIGHT SELECT / AUTOFILL FIX
===================================================== */

.light input:-webkit-autofill,

.light input:-webkit-autofill:hover,

.light input:-webkit-autofill:focus{

    -webkit-text-fill-color:
        #171a2b;

    -webkit-box-shadow:

        0
        0
        0
        1000px
        #ffffff
        inset;

    transition:
        background-color
        5000s
        ease-in-out
        0s;

}


/* =====================================================
   LIGHT SELECTION
===================================================== */

::selection{

    color:white;

    background:
        rgba(124,58,237,.8);

}

/* =====================================================
   CONTAINER
===================================================== */

.container{

    position:relative;

    z-index:2;

    width:100%;

    max-width:440px;

    animation:
        loginEntrance
        .65s
        cubic-bezier(.16,1,.3,1);

}


@keyframes loginEntrance{

    from{

        opacity:0;

        transform:
            translateY(28px)
            scale(.97);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   THEME BUTTON
===================================================== */

.theme-btn{

    position:absolute;

    top:-70px;

    right:0;

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:43px;

    padding:
        0
        17px;

    border-radius:15px;

    border:
        1px
        solid
        var(--border);

    color:
        var(--text);

    font-family:inherit;

    font-size:11px;

    font-weight:600;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    backdrop-filter:
        blur(24px);

    -webkit-backdrop-filter:
        blur(24px);

    box-shadow:
        var(--shadow);

    transition:
        .25s
        ease;

}


.theme-btn:hover{

    transform:
        translateY(-3px);

    border-color:
        rgba(0,229,255,.30);

    color:white;

    box-shadow:

        0 12px 35px
        rgba(0,0,0,.22),

        0 0 22px
        rgba(0,229,255,.08);

}


/* =====================================================
   MAIN LOGIN CARD
===================================================== */

.card{

    position:relative;

    overflow:hidden;

    padding:
        38px
        35px
        34px;

    border-radius:
        30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px
        solid
        var(--border);

    backdrop-filter:
        blur(28px);

    -webkit-backdrop-filter:
        blur(28px);

    box-shadow:
        var(--shadow);

}


/* =====================================================
   CARD TOP LIGHT
===================================================== */

.card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,229,255,.45),
            rgba(168,85,247,.45),
            transparent
        );

    opacity:.9;

}


/* =====================================================
   CARD INNER GLOW
===================================================== */

.card::after{

    content:"";

    position:absolute;

    width:240px;

    height:240px;

    top:-160px;

    right:-100px;

    border-radius:50%;

    background:
        var(--purple);

    filter:
        blur(80px);

    opacity:.09;

    pointer-events:none;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    position:relative;

    z-index:1;

    text-align:center;

    margin-bottom:9px;

    font-family:
        "Space Grotesk",
        sans-serif;

    font-size:
        clamp(28px,7vw,35px);

    font-weight:800;

    letter-spacing:1px;

    color:
        var(--text);

    text-shadow:
        0 0 25px
        rgba(255,255,255,.06);

}


.logo span{

    background:
        linear-gradient(
            90deg,
            var(--pink),
            var(--purple),
            var(--cyan)
        );

    background-size:
        200%
        200%;

    -webkit-background-clip:text;

    -webkit-text-fill-color:
        transparent;

    background-clip:text;

    animation:
        logoGradient
        5s
        ease
        infinite;

}


@keyframes logoGradient{

    0%,
    100%{

        background-position:
            0%
            50%;

    }

    50%{

        background-position:
            100%
            50%;

    }

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle{

    position:relative;

    z-index:1;

    margin-bottom:30px;

    text-align:center;

    color:
        var(--muted);

    font-size:12px;

    line-height:1.6;

}


/* =====================================================
   INPUT BOX
===================================================== */

.input-box{

    position:relative;

    z-index:1;

    margin-bottom:12px;

}


.input-box i{

    position:absolute;

    top:50%;

    left:17px;

    z-index:2;

    transform:
        translateY(-50%);

    color:
        var(--cyan);

    font-size:15px;

    filter:
        drop-shadow(
            0 0 9px
            rgba(0,229,255,.38)
        );

    transition:
        .25s
        ease;

}


/* =====================================================
   PASSWORD EYE
===================================================== */

.input-box .eye{

    left:auto;

    right:16px;

    cursor:pointer;

    color:
        #aeb4c8;

    filter:none;

}


.input-box .eye:hover{

    color:
        var(--cyan);

    transform:
        translateY(-50%)
        scale(1.08);

}


/* =====================================================
   INPUT
===================================================== */

input{

    width:100%;

    height:56px;

    padding:
        0
        50px;

    border-radius:16px;

    outline:none;

    border:
        1px
        solid
        var(--border);

    color:
        var(--text);

    font-family:inherit;

    font-size:13px;

    background:
        rgba(255,255,255,.045);

    box-shadow:

        inset
        0
        1px
        0
        rgba(255,255,255,.025);

    transition:
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease,
        transform .25s ease;

}


.light input{

    background:
        rgba(255,255,255,.62);

}


input:hover{

    border-color:
        rgba(255,255,255,.18);

    background:
        rgba(255,255,255,.06);

}


input:focus{

    border-color:
        rgba(0,229,255,.50);

    background:
        rgba(0,229,255,.025);

    box-shadow:

        0 0 0 4px
        rgba(0,229,255,.055),

        0 0 25px
        rgba(0,229,255,.06),

        inset
        0
        1px
        0
        rgba(255,255,255,.04);

}


.input-box:focus-within i:not(.eye){

    color:
        var(--purple);

    filter:
        drop-shadow(
            0 0 12px
            rgba(168,85,247,.65)
        );

}


input::placeholder{

    color:
        #747b91;

    transition:
        .2s
        ease;

}


input:focus::placeholder{

    opacity:.65;

}


/* =====================================================
   LIVE EMAIL STATUS
===================================================== */

#emailLiveStatus{

    position:relative;

    z-index:1;

    min-height:18px;

    margin-top:-3px;

    margin-bottom:6px;

    padding-left:3px;

    font-size:11px;

    line-height:18px;

    animation:
        statusShow
        .25s
        ease;

}


#emailLiveStatus:empty{

    min-height:0;

    margin:0;

}


@keyframes statusShow{

    from{

        opacity:0;

        transform:
            translateY(-3px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


.email-valid{

    color:
        var(--green);

}


.email-invalid{

    color:
        var(--danger);

}


.email-checking{

    color:
        var(--warning);

}


/* =====================================================
   OPTIONS
===================================================== */

.options{

    position:relative;

    z-index:1;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin:
        17px
        0
        25px;

    font-size:12px;

}


/* =====================================================
   REMEMBER ME
===================================================== */

.remember{

    display:flex;

    align-items:center;

    gap:10px;

    cursor:pointer;

    color:
        var(--muted);

    font-size:12px;

    user-select:none;

    transition:
        color
        .2s
        ease;

}


.remember:hover{

    color:
        var(--text);

}


.remember input{

    display:none;

}


.check-design{

    width:21px;

    height:21px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

    border-radius:7px;

    border:
        1px
        solid
        var(--border-bright);

    background:
        rgba(255,255,255,.045);

    box-shadow:

        inset
        0
        0
        12px
        rgba(255,255,255,.025);

    transition:
        .25s
        ease;

}


.check-design::after{

    content:"✓";

    font-size:13px;

    font-weight:900;

    color:white;

    opacity:0;

    transform:
        scale(.4);

    transition:
        .25s
        ease;

}


.remember input:checked
+
.check-design{

    border-color:
        rgba(0,229,255,.45);

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--cyan)
        );

    box-shadow:

        0 0 18px
        rgba(0,229,255,.20),

        inset
        0
        0
        12px
        rgba(255,255,255,.12);

}


.remember input:checked
+
.check-design::after{

    opacity:1;

    transform:
        scale(1);

}


.remember:hover
.check-design{

    transform:
        translateY(-2px);

    border-color:
        rgba(0,229,255,.30);

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

.forgot{

    color:
        var(--cyan);

    text-decoration:none;

    font-weight:600;

    white-space:nowrap;

    transition:
        .25s
        ease;

}


.forgot:hover{

    color:white;

    text-shadow:

        0 0 12px
        rgba(0,229,255,.65);

}


/* =====================================================
   LOGIN MESSAGE
===================================================== */

#loginMessage{

    position:relative;

    z-index:1;

    display:none;

    margin:
        0
        0
        15px;

    min-height:44px;

    padding:
        11px
        13px;

    border-radius:14px;

    font-size:11px;

    line-height:1.55;

    text-align:center;

    border:
        1px
        solid
        transparent;

    animation:
        loginMessageShow

<script src="./Login and register/supabase.js"></script>


<script>

/* =====================================================
   MEDIAVERSE LOGIN SYSTEM
   FULL FIXED 5-ATTEMPT VERSION

   FLOW:

   Failed #1
        ↓
   4 attempts remaining

   Failed #2
        ↓
   3 attempts remaining

   Failed #3
        ↓
   2 attempts remaining

   Failed #4
        ↓
   1 attempt remaining

   Failed #5
        ↓
   ACCOUNT LOGIN LOCKED
   05:00

   5 MINUTES
        ↓
   ATTEMPTS RESET
        ↓
   LOGIN AVAILABLE
===================================================== */


/* =====================================================
   MEDIAVERSE LOGIN SYSTEM
   SUPABASE / SQL ALIGNED VERSION

   SECURITY AUTHORITY:
   Supabase SQL / RPC

   LOGIN SECURITY CONTRACT:
   5 failed attempts
   -> 15 minute cooldown

   IMPORTANT:
   - No login-attempt counter in localStorage
   - No client-created cooldown
   - No duplicate failed-login recording
   - Supabase.js is the source of truth
===================================================== */

let loginInProgress = false;
let serverCooldownRemaining = 0;
let serverFailedAttempts = 0;
let cooldownInterval = null;


document.addEventListener("DOMContentLoaded", function(){
    initializeLoginPage();
});


function initializeLoginPage(){
    restoreRememberMe();
}


function showPassword(icon){
    const passwordInput = document.getElementById("password");
    if(!passwordInput) return;

    if(passwordInput.type === "password"){
        passwordInput.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        passwordInput.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}


function toggleTheme(){
    document.body.classList.toggle("light");

    const themeButton = document.getElementById("themeBtn");
    const isLight = document.body.classList.contains("light");

    if(themeButton){
        themeButton.innerHTML =
            isLight ? "🌙 Dark Theme" : "☀️ Light Theme";
    }
}


function handleLiveGmailValidation(){
    const emailInput = document.getElementById("email");
    const status = document.getElementById("emailLiveStatus");

    if(!emailInput || !status) return;

    const email = emailInput.value.trim().toLowerCase();

    status.className = "";
    status.innerHTML = "";

    if(email === "") return;

    const gmailRegex = /^[A-Za-z0-9._%+-]+@gmail\.com$/i;

    if(!email.includes("@")){
        status.className = "email-checking";
        status.innerHTML = '<i class="fa-solid fa-pen"></i> Enter your Gmail address.';
        return;
    }

    if(gmailRegex.test(email)){
        status.className = "email-valid";
        status.innerHTML = '<i class="fa-solid fa-circle-check"></i> Valid Gmail address';
        return;
    }

    status.className = "email-invalid";
    status.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Please enter a valid Gmail address.';
}


function setServerLoginSecurity(remainingSeconds, failedAttempts){
    serverCooldownRemaining = Math.max(0, Number(remainingSeconds || 0));
    serverFailedAttempts = Math.max(0, Number(failedAttempts || 0));
}


function formatCooldownTime(milliseconds){
    const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    return String(minutes).padStart(2,"0") + ":" + String(seconds).padStart(2,"0");
}


function getCooldownRemaining(){
    return Math.max(0, Number(serverCooldownRemaining || 0)) * 1000;
}


function resetLoginSecurity(){
    serverCooldownRemaining = 0;
    serverFailedAttempts = 0;

    clearInterval(cooldownInterval);
    cooldownInterval = null;
}


function applyServerLoginSecurity(result){
    if(!result) return false;

    const security = result.loginSecurity || {};

    const remainingSeconds = Math.max(
        0,
        Number(
            result.remainingSeconds ??
            security.remainingSeconds ??
            0
        )
    );

    const failedAttempts = Math.max(
        0,
        Number(
            result.failedAttempts ??
            security.failedAttempts ??
            0
        )
    );

    const cooldownActive =
        result.cooldownActive === true ||
        security.cooldownActive === true;

    setServerLoginSecurity(
        remainingSeconds,
        failedAttempts
    );

    if(cooldownActive && remainingSeconds > 0){
        updateCooldownUI();
        return true;
    }

    return false;
}


function updateCooldownUI(){
    const loginButton = document.getElementById("loginBtn");
    const messageBox = document.getElementById("loginMessage");

    if(!loginButton) return;

    clearInterval(cooldownInterval);

    function update(){
        const remaining = getCooldownRemaining();

        if(remaining <= 0){
            clearInterval(cooldownInterval);
            cooldownInterval = null;
            serverCooldownRemaining = 0;

            loginButton.disabled = false;
            loginButton.style.opacity = "1";
            loginButton.style.cursor = "pointer";
            loginButton.innerHTML = "Login";

            if(messageBox){
                messageBox.className = "success";
                messageBox.innerHTML =
                    '<i class="fa-solid fa-circle-check"></i> Cooldown finished. You can try logging in again.';
            }
            return;
        }

        loginButton.disabled = true;
        loginButton.style.opacity = ".65";
        loginButton.style.cursor = "not-allowed";
        loginButton.innerHTML = '<i class="fa-solid fa-lock"></i> Locked';

        if(messageBox){
            messageBox.className = "warning";
            messageBox.innerHTML =
                '<i class="fa-solid fa-shield-halved"></i> ' +
                '<strong> ACCOUNT LOGIN LOCKED</strong>' +
                '<br>Too many failed login attempts.' +
                '<span class="cooldown-timer">' +
                formatCooldownTime(remaining) +
                '</span>';
        }

        serverCooldownRemaining = Math.max(0, serverCooldownRemaining - 1);
    }

    update();
    cooldownInterval = setInterval(update, 1000);
}


function checkExistingCooldown(){
    if(serverCooldownRemaining > 0){
        updateCooldownUI();
        return true;
    }
    return false;
}


function setLoginLoading(){
    const loginButton = document.getElementById("loginBtn");
    if(!loginButton) return;

    loginButton.disabled = true;
    loginButton.style.opacity = ".7";
    loginButton.style.cursor = "wait";
    loginButton.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Signing you in...';
}


function restoreLoginButton(){
    const loginButton = document.getElementById("loginBtn");
    if(!loginButton) return;

    if(getCooldownRemaining() > 0){
        updateCooldownUI();
        return;
    }

    loginButton.disabled = false;
    loginButton.style.opacity = "1";
    loginButton.style.cursor = "pointer";
    loginButton.innerHTML = "Login";
}


function showLoginMessage(type, message){
    const messageBox = document.getElementById("loginMessage");
    if(!messageBox) return;

    messageBox.className = type;
    messageBox.innerHTML = message;
}




/* =====================================================
   REMEMBER ME
===================================================== */

function restoreRememberMe(){

    const checkbox =
        document.getElementById(
            "rememberMe"
        );


    if(!checkbox){

        return;

    }


    checkbox.checked =
        localStorage.getItem(
            "mediaverse_remember_me"
        ) === "true";


    checkbox.addEventListener(
        "change",
        function(){

            if(
                checkbox.checked
            ){

                localStorage.setItem(
                    "mediaverse_remember_me",
                    "true"
                );

            }

            else{

                localStorage.removeItem(
                    "mediaverse_remember_me"
                );

            }

        }
    );

}


/* =====================================================
   LOGIN BUTTON LOADING
===================================================== */

function setLoginLoading(){

    const loginButton =
        document.getElementById(
            "loginBtn"
        );


    loginButton.disabled =
        true;


    loginButton.style.opacity =
        ".7";


    loginButton.style.cursor =
        "wait";


    loginButton.innerHTML =

        '<i class="fa-solid fa-spinner fa-spin"></i> ' +

        'Signing you in...';

}


/* =====================================================
   RESTORE LOGIN BUTTON
===================================================== */

function restoreLoginButton(){

    const loginButton =
        document.getElementById(
            "loginBtn"
        );


    /*
       Never unlock during cooldown
    */

    if(
        getCooldownRemaining() > 0
    ){

        updateCooldownUI();

        return;

    }


    loginButton.disabled =
        false;


    loginButton.style.opacity =
        "1";


    loginButton.style.cursor =
        "pointer";


    loginButton.innerHTML =
        "Login";

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showLoginMessage(
    type,
    message
){

    const messageBox =
        document.getElementById(
            "loginMessage"
        );


    messageBox.className =
        type;


    messageBox.innerHTML =
        message;

}


/* =====================================================
   MAIN LOGIN FUNCTION
===================================================== */

async function handleMediaverseLogin(){
    if(loginInProgress) return;

    if(checkExistingCooldown()) return;

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const messageBox = document.getElementById("loginMessage");

    if(!emailInput || !passwordInput || !messageBox){
        console.error("MEDIAVERSE LOGIN: Required login elements not found.");
        return;
    }

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    messageBox.className = "";
    messageBox.innerHTML = "";

    if(!navigator.onLine){
        showLoginMessage(
            "error",
            '<i class="fa-solid fa-wifi"></i> No internet connection. Please check your network.'
        );
        return;
    }

    if(!email){
        showLoginMessage("error", "Please enter your Gmail address.");
        emailInput.focus();
        return;
    }

    const gmailRegex = /^[A-Za-z0-9._%+-]+@gmail\.com$/i;

    if(!gmailRegex.test(email)){
        showLoginMessage("error", "Please enter a valid Gmail address.");
        emailInput.focus();
        return;
    }

    if(!password){
        showLoginMessage("error", "Please enter your password.");
        passwordInput.focus();
        return;
    }

    if(password.length < 8){
        showLoginMessage("error", "Password must be at least 8 characters.");
        passwordInput.focus();
        return;
    }

    if(typeof window.loginMediaverseAccount !== "function"){
        showLoginMessage(
            "error",
            "Login system is not ready. Please check supabase.js."
        );
        return;
    }

    loginInProgress = true;
    setLoginLoading();

    showLoginMessage(
        "success",
        '<i class="fa-solid fa-shield-halved"></i> Verifying your account securely...'
    );

    try{
        const result = await window.loginMediaverseAccount(email, password);

        if(!result || result.success !== true){
            const cooldownActive = applyServerLoginSecurity(result);

            if(cooldownActive){
                passwordInput.value = "";
                return;
            }

            const failedAttempts = Math.max(
                0,
                Number(
                    result?.failedAttempts ??
                    result?.loginSecurity?.failedAttempts ??
                    0
                )
            );

            const remainingAttempts = Math.max(0, 5 - failedAttempts);
            let errorMessage =
                result?.message ||
                "Incorrect email or password.";

            if(failedAttempts > 0 && remainingAttempts > 0){
                errorMessage +=
                    remainingAttempts === 1
                        ? "<br>1 attempt remaining."
                        : "<br>" + remainingAttempts + " attempts remaining.";
            }

            showLoginMessage(
                "error",
                '<i class="fa-solid fa-triangle-exclamation"></i> "' +
                errorMessage +
                '"'
            );

            passwordInput.value = "";
            passwordInput.focus();
            return;
        }

        resetLoginSecurity();
        passwordInput.value = "";

        showLoginMessage(
            "success",
            '<i class="fa-solid fa-circle-check"></i> Login successful! Redirecting...'
        );

        setTimeout(function(){
            window.location.href = "./DASHBOARD/HOME/home.html";
        }, 800);

    } catch(error){
        console.error("MEDIAVERSE LOGIN ERROR:", error);

        showLoginMessage(
            "error",
            !navigator.onLine
                ? '<i class="fa-solid fa-wifi"></i> Network connection lost. Please try again.'
                : '<i class="fa-solid fa-circle-exclamation"></i> Unable to sign you in right now. Please try again.'
        );

    } finally {
        loginInProgress = false;

        if(getCooldownRemaining() > 0){
            updateCooldownUI();
            return;
        }

        restoreLoginButton();
    }
}




/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
            &&
            !loginInProgress
        ){

            const activeElement =
                document.activeElement;


            if(
                activeElement
                &&
                (
                    activeElement.id ===
                    "email"

                    ||

                    activeElement.id ===
                    "password"
                )
            ){

                handleMediaverseLogin();

            }

        }

    }
);


/* =====================================================
   PAGE VISIBILITY CHECK
===================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            !document.hidden
        ){

            if(
                getCooldownRemaining() > 0
            ){

                updateCooldownUI();

            }

        }

    }
);

</script>
